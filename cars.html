<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cars Dashboard</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --header: #1f4e78;
      --text: #e8eef4;
      --muted: #8b9cb3;
      --accent: #3b82f6;
      --ok: #22c55e;
      --warn: #eab308;
      --danger: #ef4444;
      --input: #243044;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
      line-height: 1.45;
    }
    h1 {
      text-align: center;
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.35rem;
      letter-spacing: -0.02em;
    }
    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      max-width: 1100px;
      margin: 0 auto;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
    }
    .card-header {
      background: var(--header);
      padding: 1rem 1.25rem;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.01em;
    }
    .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      flex: 1;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding-bottom: 0.65rem;
    }
    .row:last-child { border-bottom: none; padding-bottom: 0; }
    .label {
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }
    .value {
      font-size: 0.95rem;
      font-weight: 500;
      text-align: right;
      word-break: break-word;
    }
    .status {
      display: inline-block;
      padding: 0.2rem 0.65rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    .status.ok { background: rgba(34,197,94,0.18); color: var(--ok); }
    .status.due { background: rgba(234,179,8,0.18); color: var(--warn); }
    .status.expired { background: rgba(239,68,68,0.18); color: var(--danger); }
    .days {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }
    .days.ok { color: var(--ok); }
    .days.due { color: var(--warn); }
    .days.expired { color: var(--danger); }
    .loading, .error {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
      max-width: 500px;
      margin: 0 auto;
    }
    .error { color: var(--danger); }
    .footer {
      text-align: center;
      margin-top: 2.5rem;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .footer a { color: var(--accent); text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
    @media (max-width: 480px) {
      body { padding: 1.25rem 0.75rem 3rem; }
      h1 { font-size: 1.4rem; }
      .card-header { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <h1>Cars</h1>
  <p class="subtitle">Live from your insurance dashboard</p>
  <div id="app">
    <div class="loading">Loading vehicle data…</div>
  </div>
  <p class="footer">Data updates automatically from the linked spreadsheet.<br>
  Last refreshed: <span id="refreshed">—</span></p>

  <script>
    // Google Sheet ID (native Google Sheet version of your dashboard)
    const SHEET_ID = "1E8diVvIW3Pg2xTVeFy5NBqDaZrPIJ-tTsHle2o5nsgo";

    // CSV export endpoints (works when sheet is set to "Anyone with the link can view")
    const vehiclesUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Vehicles`;
    const policiesUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Policies`;

    function parseCSV(text) {
      const rows = [];
      let current = [];
      let inQuotes = false;
      let field = "";
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i + 1];
        if (c === '"' && inQuotes && next === '"') {
          field += '"';
          i++;
        } else if (c === '"') {
          inQuotes = !inQuotes;
        } else if (c === ',' && !inQuotes) {
          current.push(field);
          field = "";
        } else if ((c === '\n' || c === '\r') && !inQuotes) {
          if (field !== "" || current.length) {
            current.push(field);
            rows.push(current);
            current = [];
            field = "";
          }
          if (c === '\r' && next === '\n') i++;
        } else {
          field += c;
        }
      }
      if (field !== "" || current.length) {
        current.push(field);
        rows.push(current);
      }
      return rows;
    }

    function parseDate(str) {
      if (!str) return null;
      // Handle DD/MM/YYYY or YYYY-MM-DD or Excel serial-ish
      const s = String(str).trim();
      if (/^\d{4}-\d{2}-\d{2}/.test(s)) return new Date(s.slice(0, 10));
      const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
      const d = new Date(s);
      return isNaN(d.getTime()) ? null : d;
    }

    function daysUntil(date) {
      if (!date) return null;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const target = new Date(date);
      target.setHours(0, 0, 0, 0);
      return Math.round((target - today) / 86400000);
    }

    function formatDate(d) {
      if (!d) return "TBC";
      const day = String(d.getDate()).padStart(2, "0");
      const month = String(d.getMonth() + 1).padStart(2, "0");
      return `${day}/${month}/${d.getFullYear()}`;
    }

    function statusFor(days) {
      if (days === null) return { cls: "", label: "—" };
      if (days < 0) return { cls: "expired", label: "EXPIRED" };
      if (days <= 30) return { cls: "due", label: "DUE SOON" };
      return { cls: "ok", label: "OK" };
    }

    async function load() {
      const app = document.getElementById("app");
      try {
        const [vRes, pRes] = await Promise.all([
          fetch(vehiclesUrl),
          fetch(policiesUrl)
        ]);
        if (!vRes.ok || !pRes.ok) {
          throw new Error("Could not load sheet data. Make sure the Google Sheet is shared as “Anyone with the link can view”.");
        }
        const vText = await vRes.text();
        const pText = await pRes.text();
        const vRows = parseCSV(vText);
        const pRows = parseCSV(pText);

        // Expected Vehicles header: Vehicle, Reg, MOT Expiry, Tax Status, Service Status, Current Mileage, Front Tyre Size, Rear Tyre Size, ...
        // Expected Policies header: Policy Holder, Vehicle, Reg, Insurer, ..., End
        const vehicles = [];
        for (let i = 1; i < vRows.length; i++) {
          const r = vRows[i];
          if (!r[0] || !r[0].trim()) continue;
          vehicles.push({
            name: r[0].trim(),
            reg: (r[1] || "").trim(),
            mot: parseDate(r[2]),
            tax: (r[3] || "").trim() || "TBC",
            service: (r[4] || "").trim() || "TBC",
            mileage: (r[5] || "").trim(),
            frontTyre: (r[6] || "").trim(),
            rearTyre: (r[7] || "").trim()
          });
        }

        const policyByReg = {};
        for (let i = 1; i < pRows.length; i++) {
          const r = pRows[i];
          if (!r[2]) continue;
          const reg = r[2].trim();
          policyByReg[reg] = {
            insurer: (r[3] || "").trim() || "TBC",
            renewal: parseDate(r[8])  // End column (index 8)
          };
        }

        if (vehicles.length === 0) {
          app.innerHTML = '<div class="error">No vehicle data found. Check the Vehicles sheet.</div>';
          return;
        }

        let html = '<div class="grid">';
        for (const v of vehicles) {
          const pol = policyByReg[v.reg] || { insurer: "TBC", renewal: null };
          const days = daysUntil(v.mot);
          const st = statusFor(days);
          const tyre = (v.frontTyre || v.rearTyre)
            ? `${v.frontTyre || "—"} / ${v.rearTyre || "—"}`
            : "—";
          const mileage = v.mileage ? `${v.mileage} miles` : "—";

          html += `
            <article class="card">
              <div class="card-header">${v.name} — ${v.reg}</div>
              <div class="card-body">
                <div class="row">
                  <span class="label">Insurance Renewal</span>
                  <span class="value">${formatDate(pol.renewal)}</span>
                </div>
                <div class="row">
                  <span class="label">Insured by</span>
                  <span class="value">${pol.insurer}</span>
                </div>
                <div class="row">
                  <span class="label">MOT Expiry</span>
                  <span class="value">${formatDate(v.mot)}</span>
                </div>
                <div class="row">
                  <span class="label">Days until MOT</span>
                  <span class="value">
                    <span class="days ${st.cls}">${days === null ? "—" : days}</span>
                    <span class="status ${st.cls}">${st.label}</span>
                  </span>
                </div>
                <div class="row">
                  <span class="label">Tax Status</span>
                  <span class="value">${v.tax}</span>
                </div>
                <div class="row">
                  <span class="label">Service Status</span>
                  <span class="value">${v.service}</span>
                </div>
                <div class="row">
                  <span class="label">Mileage</span>
                  <span class="value">${mileage}</span>
                </div>
                <div class="row">
                  <span class="label">Front / Rear Tyres</span>
                  <span class="value">${tyre}</span>
                </div>
              </div>
            </article>`;
        }
        html += "</div>";
        app.innerHTML = html;
        document.getElementById("refreshed").textContent = new Date().toLocaleString("en-GB");
      } catch (err) {
        app.innerHTML = `<div class="error">${err.message}</div>`;
        console.error(err);
      }
    }

    load();
    // Optional: refresh every 10 minutes while page is open
    setInterval(load, 10 * 60 * 1000);
  </script>
</body>
</html>
